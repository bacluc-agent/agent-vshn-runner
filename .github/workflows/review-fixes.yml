name: Review fixes runner

on:
  schedule:
    - cron: "32 */4 * * *" # Every 4 hours at :32
  workflow_dispatch:
    inputs:
      prompt:
        description: >-
          Optional override prompt for all PRs (leave empty for
          auto-generation).
        required: false
        type: string
      model:
        description: Optional OpenCode model override (e.g. vshn-us-ai/subscription.glm-5.2)
        required: false
        type: string

permissions:
  actions: write
  artifact-metadata: write
  checks: read
  packages: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Find all open PRs with review comments from @Bacluc or @bacluc-agent
  # ---------------------------------------------------------------------------
  find-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      count: ${{ steps.find.outputs.count }}
      pr_metadata: ${{ steps.find.outputs.pr_metadata }}
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ISSUE_REPOSITORY || github.repository }}
          fetch-depth: 0
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Find PRs with review comments
        id: find
        shell: bash
        env:
          OVERRIDE_PROMPT: ${{ inputs.prompt }}
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"

          prs_file="$RUNNER_TEMP/prs.json"
          : > "$prs_file"

          # Repos to scan for open PRs. The runner repo is where the agents
          # open PRs; the issue repo is where issues live. Both may hold PRs.
          repos_to_scan=("$ISSUE_REPOSITORY" "bacluc-agent/agent-vshn-runner")
          # Deduplicate in case ISSUE_REPOSITORY == runner repo
          unique_repos=()
          declare -A repo_seen
          for r in "${repos_to_scan[@]}"; do
            if [[ -z "${repo_seen[$r]+_}" ]]; then
              repo_seen[$r]=1
              unique_repos+=("$r")
            fi
          done

          # Reviewers whose feedback we act on
          reviewers=("BacLuc" "bacluc-agent")

          # Keyed by "repo/number" -> repo, deduplicated across repos
          declare -A found

          for repo in "${unique_repos[@]}"; do
            # Enumerate all open PRs in this repo (search index is unreliable
            # for commenter:; enumerate and check comments directly instead).
            while IFS= read -r pr_number; do
              [[ -n "$pr_number" ]] || continue

              # Check issue comments, review comments, and formal reviews
              # for any of the reviewers. Any of these counts as feedback.
              has_feedback=false
              for user in "${reviewers[@]}"; do
                if gh api "repos/${repo}/issues/${pr_number}/comments?per_page=100" \
                     --jq "[.[] | select(.user.login == \"${user}\")] | length" 2>/dev/null | grep -q '[1-9]'; then
                  has_feedback=true
                  break
                fi
                if gh api "repos/${repo}/pulls/${pr_number}/comments?per_page=100" \
                     --jq "[.[] | select(.user.login == \"${user}\")] | length" 2>/dev/null | grep -q '[1-9]'; then
                  has_feedback=true
                  break
                fi
                if gh api "repos/${repo}/pulls/${pr_number}/reviews?per_page=100" \
                     --jq "[.[] | select(.user.login == \"${user}\")] | length" 2>/dev/null | grep -q '[1-9]'; then
                  has_feedback=true
                  break
                fi
              done

              if [[ "$has_feedback" == true ]]; then
                found["${repo}/${pr_number}"]="$repo"
              fi
            done < <(
              gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" \
                --jq '.[].number' 2>/dev/null || true
            )
          done

          # Build sorted list of "repo/number" keys
          mapfile -t unique_keys < <(printf '%s\n' "${!found[@]}" | sort -t/ -k3 -n)

          if [[ ${#unique_keys[@]} -eq 0 || -z "${unique_keys[0]}" ]]; then
            printf '%s\n' 'No open PRs with review comments found.'
            {
              echo "prs<<PRS_EOF"
              echo "[]"
              echo "PRS_EOF"
              echo "count=0"
              echo "pr_metadata<<META_EOF"
              echo "{}"
              echo "META_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Output PR identifiers as JSON array of "repo/number" strings
          printf '%s\n' "${unique_keys[@]}" | jq -R . | jq -s . > "$prs_file"

          printf 'Found %d open PR(s) with review comments:\n' "${#unique_keys[@]}"
          for key in "${unique_keys[@]}"; do
            printf '  %s\n' "$key"
          done

          pr_metadata="{}"
          for key in "${unique_keys[@]}"; do
            pr_repo="${found[$key]}"
            pr_number="${key##*/}"
            pr_info=$(gh pr view "$pr_number" -R "$pr_repo" --json number,title,headRefName,url)
            if [[ -n "${OVERRIDE_PROMPT:-}" ]]; then
              prompt="$OVERRIDE_PROMPT"
            else
              title=$(jq -r '.title' <<<"$pr_info")
              head_ref=$(jq -r '.headRefName' <<<"$pr_info")
              url=$(jq -r '.url' <<<"$pr_info")
              prompt=$(printf '%s\n' \
                "PR #${pr_number}: ${title}" \
                "Repository: ${pr_repo}" \
                "Branch: ${head_ref}" \
                "URL: ${url}" \
                "" \
                "Apply the review comments for this PR. Check the PR review comments," \
                "implement the requested changes, push to the PR branch, and verify" \
                "the changes work. Update the corresponding issue with progress.")
            fi
            pr_info=$(jq --arg prompt "$prompt" --arg repo "$pr_repo" \
              '. + {prompt: $prompt, repository: $repo}' <<<"$pr_info")
            pr_metadata=$(jq --argjson pr "$pr_info" --arg key "$key" \
              '. + {($key): $pr}' <<<"$pr_metadata")
          done

          {
            echo "prs<<PRS_EOF"
            cat "$prs_file"
            echo "PRS_EOF"
            echo "count=${#unique_keys[@]}"
            echo "pr_metadata<<META_EOF"
            echo "$pr_metadata"
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Process each PR — dispatch to opencode workflow (matrix)
  # ---------------------------------------------------------------------------
  process-prs:
    needs: find-prs
    if: needs.find-prs.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.find-prs.outputs.prs) }}
    uses: ./.github/workflows/opencode.yml
    with:
      prompt: ${{ fromJson(needs.find-prs.outputs.pr_metadata)[matrix.pr].prompt }}
      model: ${{ inputs.model }}
      repository: ${{ fromJson(needs.find-prs.outputs.pr_metadata)[matrix.pr].repository }}
    secrets: inherit
